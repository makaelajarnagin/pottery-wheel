<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wheel — A Quiet Pottery Meditation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ═══ PALETTE — evening (default) ═══════════════════════════════════ */
    :root {
      --ui-fg:     212, 196, 168;   /* warm cream */
      --ui-bg:     26, 20, 16;      /* deep umber */
      --vignette:  18, 13, 10;
    }
    /* ═══ PALETTE — morning (light mode) ════════════════════════════════ */
    body.morning {
      --ui-fg:     74, 58, 44;      /* warm brown ink */
      --ui-bg:     240, 234, 224;   /* linen */
      --vignette:  200, 188, 172;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1410;
      font-family: 'Cormorant Garamond', Georgia, serif;
      cursor: none;
      transition: background 1.8s ease;
    }
    body.morning { background: #e8e0d4; }

    #canvas-container {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* ═══ Vignette — flips in light mode ═══════════════════════════════ */
    #vignette {
      position: fixed; inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 120% 110% at 42% 38%,
        transparent 0%,
        transparent 45%,
        rgba(var(--vignette), 0.12) 70%,
        rgba(var(--vignette), 0.50) 100%
      );
      z-index: 2;
      transition: opacity 1.8s ease;
    }
    body.morning #vignette { opacity: 0.55; }

    /* ═══ Film grain ═══════════════════════════════════════════════════ */
    #grain {
      position: fixed; inset: 0;
      pointer-events: none;
      opacity: 0.035;
      z-index: 3;
      mix-blend-mode: overlay;
      transition: opacity 1.8s ease;
    }
    body.morning #grain { opacity: 0.025; mix-blend-mode: multiply; }

    /* ═══ Intro card ═══════════════════════════════════════════════════ */
    #intro {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(var(--ui-fg), 0.9);
      z-index: 10;
      opacity: 1;
      transition: opacity 2.5s cubic-bezier(0.4, 0.0, 0.2, 1), color 1.8s ease;
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    body.morning #intro { text-shadow: 0 2px 16px rgba(255,250,240,0.6); }
    #intro.fade { opacity: 0; }
    #intro h1 {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      font-style: italic;
    }
    #intro p {
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.65;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    /* ═══ Cursor — soft fingertip impression ═══════════════════════════ */
    #cursor {
      position: fixed;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(var(--ui-fg), 0.4);
      background: radial-gradient(circle, rgba(var(--ui-fg),0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 5;
      transform: translate(-50%, -50%);
      transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease;
    }
    #cursor.touching {
      width: 44px; height: 44px;
      border-color: rgba(var(--ui-fg), 0.7);
      background: radial-gradient(circle, rgba(var(--ui-fg),0.15) 0%, transparent 60%);
    }

    /* ═══ Controls — shared chrome ═════════════════════════════════════ */
    .ctrl {
      position: fixed;
      border: 1px solid rgba(var(--ui-fg), 0.22);
      background: rgba(var(--ui-bg), 0.35);
      backdrop-filter: blur(8px);
      cursor: pointer;
      z-index: 6;
      transition: border-color 0.3s ease, background 1.8s ease, color 1.8s ease;
    }
    .ctrl:hover { border-color: rgba(var(--ui-fg), 0.55); }

    /* Sound toggle — bottom right */
    #sound-toggle {
      bottom: 32px; right: 32px;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center; justify-content: center;
    }
    #sound-toggle svg { width: 18px; height: 18px; fill: rgba(var(--ui-fg), 0.65); transition: fill 1.8s ease; }
    #sound-toggle.muted svg.on { display: none; }
    #sound-toggle:not(.muted) svg.off { display: none; }

    /* Mood toggle — above sound toggle */
    #mood-toggle {
      bottom: 88px; right: 32px;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center; justify-content: center;
    }
    #mood-toggle svg {
      width: 18px; height: 18px;
      fill: none;
      stroke: rgba(var(--ui-fg), 0.65);
      stroke-width: 1.5;
      stroke-linecap: round;
      transition: stroke 1.8s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #mood-toggle.morning svg.moon { display: none; }
    #mood-toggle:not(.morning) svg.sun { display: none; }
    #mood-toggle:hover svg { transform: rotate(15deg); }

    /* Fresh clay — bottom left */
    #reset {
      bottom: 32px; left: 32px;
      padding: 10px 20px;
      color: rgba(var(--ui-fg), 0.6);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 2px;
    }
    #reset:hover { color: rgba(var(--ui-fg), 0.9); }
  </style>
